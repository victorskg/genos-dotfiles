source = ~/.config/hypr/colors.conf

$mod = SUPER
$terminal = kitty
$launcher = fuzzel
$browser = zen-browser

monitor = ,preferred,auto,1

general {
    gaps_in = $gap_in
    gaps_out = $gap_out
    border_size = $border
    col.active_border = $accent_bright
    col.inactive_border = $line
    layout = dwindle
}

decoration {
    rounding = $radius_window

    shadow {
        enabled = false
    }

    blur {
        enabled = $blur_enabled
        size = $blur_size
        passes = $blur_passes
        noise = $blur_noise
        brightness = $blur_brightness
        contrast = 1.0
        vibrancy = $blur_vibrancy
        new_optimizations = true
        xray = false
        popups = true
    }
}

animations {
    enabled = true
    bezier = slow, 0.4, 0.0, 0.2, 1.0
    animation = windows, 1, 3, slow
    animation = windowsIn, 1, 3, slow
    animation = windowsOut, 1, 4, slow
    animation = fade, 1, 4, slow
    animation = layers, 1, 4, slow, fade
    animation = border, 1, 6, slow
    animation = workspaces, 1, 4, slow, fade
}

misc {
    background_color = $bg
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

layerrule {
    name = bar-blur
    match:namespace = waybar
    blur = true
    ignore_alpha = 0.15
}

layerrule {
    name = launcher-blur
    match:namespace = fuzzel
    blur = true
    ignore_alpha = 0.15
}

layerrule {
    name = notification-blur
    match:namespace = notifications
    blur = true
    ignore_alpha = 0.15
}

input {
    kb_layout = br
    kb_variant = abnt2
}

windowrule {
    name = open-alone
    match:modal = false
    workspace = emptynm
}

bind = $mod, T, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, M, exit

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, comma, workspace, r-1
bind = $mod, period, workspace, r+1

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, comma, movetoworkspace, r-1
bind = $mod SHIFT, period, movetoworkspace, r+1

bind = , Print, exec, ~/.config/hypr/screenshot
bind = SHIFT, Print, exec, ~/.config/hypr/screenshot region
bind = $mod, W, exec, ~/.config/hypr/wallpaper next
bind = $mod SHIFT, W, exec, ~/.config/hypr/wallpaper prev

bind = $mod SHIFT, left, movewindow, mon:eDP-1
bind = $mod SHIFT, right, movewindow, mon:HDMI-A-1

exec-once = waybar
exec-once = ~/.config/hypr/wallpaper show
exec = ~/.config/hypr/workspace-follow.py
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1


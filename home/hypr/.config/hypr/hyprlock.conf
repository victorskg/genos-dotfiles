source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $fg
    font_family = $font_ui
    check_color = $muted
    fail_color = $danger
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = $font_lock_size
    font_family = $font_lock
    color = $fg
    position = 0, 80
    halign = center
    valign = center
}

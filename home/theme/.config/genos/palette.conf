# GenOS dark fantasy. Edit this file, then run apply-theme.
# variant=blood uses crimson as the focus accent. variant=eclipse uses violet.
# variant=verdigris uses oxidized teal. variants.conf maps each wallpaper to a variant.

variant=verdigris
opacity_mode=transparent

# Neutrals are tinted by the variant hue so surfaces and accent read as one color.
blood_bg=0B0909
blood_surface=161112
blood_overlay=1F1819
blood_line=2A2022
eclipse_bg=0A090F
eclipse_surface=15121C
eclipse_overlay=1E1A28
eclipse_line=2A2438
verdigris_bg=080B0B
verdigris_surface=101616
verdigris_overlay=182121
verdigris_line=233131

fg=F3E6D6
muted=CDBEB4
faint=9A8E88

blood=CE0D1B
blood_dim=8E0812
blood_bright=FF3B45
violet=8839DF
violet_dim=5A2494
violet_bright=C084FC
verdigris=2A9D96
verdigris_dim=1B6B66
verdigris_bright=64C0BB
gold=F0B429
steel=7E8B96

success=3DDC97
warning=FFB020
error=FF7A72

opacity_terminal=0.92
opacity_bar=0.92
opacity_launcher=0.94
opacity_notifications=0.94
opacity_lock=0.8

blur_size=4
blur_passes=2
blur_noise=0.02
blur_brightness=1
blur_vibrancy=0.55

shadow_range=28
shadow_alpha=0.55

gap_in=6
gap_out=12
border=2
radius_window=12
radius_popup=16
bar_width=48
bar_margin=12
font_ui=15
